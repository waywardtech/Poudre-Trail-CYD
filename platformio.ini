; Poudre Trail CYD - PlatformIO build configuration
;
; Board targets (LCD on SCK=14 MISO=12 MOSI=13, CS=15, DC=2):
;   esp32-2432S028R        2.8" ILI9341 320x240  (default; micro-USB CYD)
;   esp32-2432S028R-st7789 2.8" ST7789  320x240  (USB-C CYD2USB variant; use if
;                          colours look inverted or the picture is shifted)
;   esp32-3248S035R        3.5" ST7796 480x320
; The 2.8" board does NOT share the bus: SD is on VSPI 18/19/23 and touch on
; 25/32/39 (pin map from waywardtech/CYD-Diagnostic). See include/cyd_display.h.
; Pick one with:  pio run -e esp32-3248S035R

[platformio]
default_envs = esp32-2432S028R

[env]
platform = espressif32
board    = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bitbank2/AnimatedGIF @ ^2.1.1
    bitbank2/PNGdec @ ^1.0.3

[common]
build_flags =
    -std=gnu++17
    -DUSER_SETUP_LOADED=1
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -Iinclude

[env:esp32-3248S035R]
build_flags =
    ${common.build_flags}
    -DCYD_BOARD_3248S035R=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_BL=27
    -DSPI_FREQUENCY=40000000

[env:esp32-2432S028R]
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX @ ^1.2.0
build_flags =
    ${common.build_flags}
    -DCYD_BOARD_2432S028R=1
    -DUSE_HSPI_PORT=1
    -DILI9341_DRIVER=1
    -DTFT_BL=21
    -DSPI_FREQUENCY=27000000

[env:esp32-2432S028R-st7789]
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX @ ^1.2.0
build_flags =
    ${common.build_flags}
    -DCYD_BOARD_2432S028R=1
    -DUSE_HSPI_PORT=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DTFT_BL=21
    -DSPI_FREQUENCY=40000000
