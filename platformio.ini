; Poudre Trail CYD -- bring-up firmware
;
; Default target is the common micro-USB ESP32-2432S028R (ILI9341 panel):
;   pio run -t upload
; If colours look inverted or the picture is shifted (later USB-C boards ship
; an ST7789 panel), use:
;   pio run -e esp32-2432S028R-st7789 -t upload
;
; Pin map and panel settings come from waywardtech/CYD-Diagnostic
; (firmware/src/config.h, firmware/src/display.h).
;
; Fine-tuning without editing code: add any of these to build_flags
;   -DCYD_INVERT=0|1  -DCYD_RGB_ORDER=0|1  -DCYD_OFFSET_X=n -DCYD_OFFSET_Y=n
;   -DCYD_TOUCH_X_MIN=n -DCYD_TOUCH_X_MAX=n -DCYD_TOUCH_Y_MIN=n -DCYD_TOUCH_Y_MAX=n

[platformio]
default_envs = esp32-2432S028R

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder, time
lib_deps =
  lovyan03/LovyanGFX@^1.2.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -Wall

[env:esp32-2432S028R]

[env:esp32-2432S028R-st7789]
build_flags =
  ${env.build_flags}
  -DCYD_PANEL_ST7789=1
