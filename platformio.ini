; Poudre Trail CYD - PlatformIO build configuration
;
; Target: ESP32-2432S028R ("Cheap Yellow Display", 2.8", 320x240). Pins, buses,
; panel variants and touch calibration are in include/cyd_display.h, taken from
; the CYD System Inspector project (waywardtech/CYD-Diagnostic).
;
;   esp32-2432S028R         micro-USB board, ILI9341 panel   (default)
;   esp32-2432S028R-st7789  USB-C board, ST7789 panel (inverted colour)
;
; Pick one with:  pio run -e esp32-2432S028R-st7789 -t upload

[platformio]
default_envs = esp32-2432S028R

[env]
platform = espressif32@^6.9.0
board    = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    bitbank2/AnimatedGIF @ ^2.1.1
    bitbank2/PNGdec @ ^1.0.3
build_flags =
    -std=gnu++17
    -Iinclude

[env:esp32-2432S028R]

[env:esp32-2432S028R-st7789]
build_flags =
    ${env.build_flags}
    -DCYD_PANEL_ST7789=1
