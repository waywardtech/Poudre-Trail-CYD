; Poudre Trail CYD — PlatformIO build configuration
; Target: ESP32-2432S028R ("Cheap Yellow Display")
; Display: ILI9341 (320×240) via TFT_eSPI
; Touch:   XPT2046 via XPT2046_Touchscreen
; Storage: SD card (shared SPI bus, CS=5)

[env:esp32-2432S028R]
platform = espressif32
board    = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; TFT_eSPI pin config injected via build flags (no User_Setup.h needed)
build_flags =
    -std=gnu++17
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=21
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -Iinclude
