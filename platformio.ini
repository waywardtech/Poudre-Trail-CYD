; Poudre Trail CYD - PlatformIO build configuration
;
; Two board targets (same shared SPI bus: SCK=14 MISO=12 MOSI=13,
; TFT CS=15, touch CS=33, SD CS=5):
;   esp32-3248S035R  3.5" ST7796 480x320   (default)
;   esp32-2432S028R  2.8" ILI9341 320x240
; Pick one with:  pio run -e esp32-2432S028R

[platformio]
default_envs = esp32-3248S035R

[env]
platform = espressif32
board    = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

[common]
build_flags =
    -std=gnu++17
    -DUSER_SETUP_LOADED=1
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -Iinclude

[env:esp32-3248S035R]
build_flags =
    ${common.build_flags}
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_BL=27
    -DSPI_FREQUENCY=40000000

[env:esp32-2432S028R]
build_flags =
    ${common.build_flags}
    -DILI9341_DRIVER=1
    -DTFT_BL=21
    -DSPI_FREQUENCY=27000000
